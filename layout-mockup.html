<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévia do Novo Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        
        /* HEADER FIXO NO TOPO */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .status-group {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-left: 24px;
            border-left: 1px solid #334155;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(34, 197, 94, 0.15);
            border-radius: 4px;
            color: #22c55e;
            font-weight: 600;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .sync-time {
            font-size: 12px;
            color: #cbd5e1;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-sync {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }
        
        .btn-sync:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        
        .btn-details {
            background: rgba(100, 116, 139, 0.3);
            color: #cbd5e1;
            border: 1px solid #475569;
        }
        
        .btn-details:hover {
            background: rgba(100, 116, 139, 0.5);
            border-color: #64748b;
        }
        
        /* CONTEÚDO PRINCIPAL */
        .main-content {
            margin-top: 80px;
            min-height: calc(100vh - 80px);
            padding: 40px 24px;
        }
        
        /* NAVEGAÇÃO (abas) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 8px 16px;
            border: none;
            background: none;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        
        .nav-tab:hover {
            color: #e2e8f0;
        }
        
        .nav-tab.active {
            color: #22c55e;
        }
        
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 2px;
            background: #22c55e;
            border-radius: 1px;
        }
        
        /* CONTAINER CENTRALIZADO */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
        }
        
        .content-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #e2e8f0;
        }
        
        .content-placeholder {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            padding: 40px;
            text-align: center;
            background: rgba(51, 65, 85, 0.2);
            border-radius: 8px;
            border: 1px dashed #475569;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                height: auto;
                flex-wrap: wrap;
                padding: 12px;
                gap: 12px;
            }
            
            .status-group {
                padding-left: 0;
                border-left: none;
                width: 100%;
                border-top: 1px solid #334155;
                padding-top: 12px;
                flex-wrap: wrap;
            }
            
            .nav-tabs {
                gap: 12px;
            }
            
            .nav-tab {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER FIXO -->
    <div class="header">
        <div class="header-left">
            <div class="logo-section">
                <div class="logo">D</div>
                <span>Dinâmica</span>
            </div>
            
            <div class="status-group">
                <div class="status-item">
                    <div class="live-badge">
                        <div class="live-dot"></div>
                        LIVE
                    </div>
                </div>
                
                <div class="status-item">
                    <span class="sync-time">Última sync: 09/05/2026, 00:20:03</span>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <button class="btn btn-sync">
                <span>🔄</span>
                Sincronizar
            </button>
            <button class="btn btn-details">
                Detalhar Atualização
            </button>
        </div>
    </div>
    
    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">
        <!-- NAVEGAÇÃO DAS ABAS (agora abaixo e centralizada) -->
        <div class="nav-tabs">
            <button class="nav-tab active">DASHBOARD</button>
            <button class="nav-tab">FINANCEIRO</button>
            <button class="nav-tab">OBRAS</button>
            <button class="nav-tab">LOGISTICA</button>
        </div>
        
        <!-- CONTEÚDO CENTRALIZADO -->
        <div class="content-container">
            <h2 class="content-title">Dashboard</h2>
            <div class="content-placeholder">
                Aqui viria o conteúdo específico de cada aba<br/>
                Dashboard | Financeiro | Obras | Logística<br/>
                <br/>
                O espaço é centralizado com max-width: 1200px para melhor leitura
            </div>
        </div>
    </div>
</body>
</html>
